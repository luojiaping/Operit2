edition = "2021"
license = "MIT"
publish = false
description = "Embedded document-driven UI runtime for Operit devices."

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }
