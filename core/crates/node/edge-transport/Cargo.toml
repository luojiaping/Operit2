[package]
name = "operit-edge-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Transport adapters for standard Operit Link communication with lightweight Edge nodes."

[dependencies]
async-trait.workspace = true
base64.workspace = true
hmac = "0.12"
operit-host-api = { path = "../../foundation/host-api" }
operit-link = { path = "../../foundation/link" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
uuid.workspace = true
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync"] }
