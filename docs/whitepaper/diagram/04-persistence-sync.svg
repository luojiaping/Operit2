<text x="187.5" y="405" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">UI / watch 获得变化</text>
<polyline points="180,440 180,510 525,510 525,550" fill="none" stroke="#2c5f9e" stroke-width="2"/>
<polygon points="525,550 530.0,539.0 520.0,539.0" fill="#2c5f9e"/>
<rect x="40" y="550" width="970" height="102" rx="9" fill="#f0f5fb" stroke="#2c5f9e" stroke-width="1.6"/>
<text x="525.0" y="580" fill="#2c5f9e" font-size="22" font-weight="700" text-anchor="middle">注册 snapshot owner 的附加闭环</text>
<text x="525.0" y="608" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">稳定导出范围下比较内容摘要 → 必要时选择完整快照校正 → 初始化事务与覆盖凭据</text>
<text x="525.0" y="635" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">当前覆盖 Preference / 聊天 SQL / 插件 SQL；不是所有数据的统一修复</text>
<text x="32" y="684" fill="#526575" font-size="18" font-weight="400" text-anchor="start">本图不表达跨设备分布式 ACID，也不保证一般业务操作可交换。</text>
</svg>
