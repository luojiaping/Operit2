<text x="870.0" y="378" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">格式 / 依赖 / blob / 迁移</text>
<text x="870.0" y="405" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">未就绪记录保留待处理</text>
<rect x="390" y="320" width="285" height="120" rx="9" fill="#f1f8f4" stroke="#16704a" stroke-width="1.6"/>
