<text x="187.5" y="178" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">事务 / preference / SQL / 文件</text>
<text x="187.5" y="205" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">来源 ID 与序号、修订信息</text>
<rect x="390" y="120" width="285" height="120" rx="9" fill="#fbf7ed" stroke="#8c6000" stroke-width="1.6"/>
<text x="532.5" y="150" fill="#8c6000" font-size="22" font-weight="700" text-anchor="middle">增量交换</text>
<text x="532.5" y="178" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">授权检查与 endpoint 协商</text>
<text x="532.5" y="205" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">按接收知识导出缺失操作</text>
<rect x="730" y="120" width="280" height="120" rx="9" fill="#f5f2fa" stroke="#6a4ca3" stroke-width="1.6"/>
<text x="870.0" y="150" fill="#6a4ca3" font-size="22" font-weight="700" text-anchor="middle">接收账本</text>
<text x="870.0" y="178" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">原文身份与去重</text>
<text x="870.0" y="205" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">稀疏收据保留历史空洞</text>
<rect x="730" y="320" width="280" height="120" rx="9" fill="#f1f8f4" stroke="#16704a" stroke-width="1.6"/>
