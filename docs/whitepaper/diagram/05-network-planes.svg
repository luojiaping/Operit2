<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 610" role="img" aria-label="05  网络可达性与三类数据路径">
<style>text {font-family: SimHei, "Noto Sans SC", "Microsoft YaHei", sans-serif;}</style>
<rect x="0" y="0" width="1050" height="610" rx="12" fill="#ffffff"/>
<text x="32" y="42" fill="#172a3a" font-size="26" font-weight="700" text-anchor="start">05  网络可达性与三类数据路径</text>
<text x="32" y="73" fill="#526575" font-size="18" font-weight="400" text-anchor="start">配对、Space 成员身份、调用授权与业务存储资格需要分别判断</text>
<polyline points="280,185 405,185" fill="none" stroke="#8c6000" stroke-width="2"/>
<polygon points="405,185 394.0,180.0 394.0,190.0" fill="#8c6000"/>
<text x="342.5" y="175.0" fill="#8c6000" font-size="18" font-weight="400" text-anchor="middle">PeerLink</text>
<polyline points="650,185 775,185" fill="none" stroke="#8c6000" stroke-width="2"/>
<polygon points="775,185 764.0,180.0 764.0,190.0" fill="#8c6000"/>
<text x="712.5" y="175.0" fill="#8c6000" font-size="18" font-weight="400" text-anchor="middle">PeerLink</text>
<rect x="40" y="130" width="240" height="110" rx="9" fill="#f0f8fa" stroke="#007b8b" stroke-width="1.6"/>
<text x="160.0" y="160" fill="#007b8b" font-size="22" font-weight="700" text-anchor="middle">节点 A</text>
<text x="160.0" y="188" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">调用方 / 本地副本</text>
<rect x="405" y="130" width="245" height="110" rx="9" fill="#fbf7ed" stroke="#8c6000" stroke-width="1.6"/>
<text x="527.5" y="160" fill="#8c6000" font-size="22" font-weight="700" text-anchor="middle">节点 B</text>
<text x="527.5" y="188" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">中间跳 / 可有业务副本</text>
<rect x="775" y="130" width="235" height="110" rx="9" fill="#f1f8f4" stroke="#16704a" stroke-width="1.6"/>
<text x="892.5" y="160" fill="#16704a" font-size="22" font-weight="700" text-anchor="middle">节点 C</text>
<text x="892.5" y="188" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">执行目标 / 本地 Host</text>
<rect x="40" y="300" width="970" height="70" rx="9" fill="#fcf2f4" stroke="#ac3550" stroke-width="1.6"/>
<text x="525.0" y="330" fill="#ac3550" font-size="22" font-weight="700" text-anchor="middle">控制路径：成员、权限、审批与撤销；独立于业务同步知识进度</text>
<rect x="40" y="405" width="970" height="70" rx="9" fill="#f0f8fa" stroke="#007b8b" stroke-width="1.6"/>
<text x="525.0" y="435" fill="#007b8b" font-size="22" font-weight="700" text-anchor="middle">实时路径：Call / Watch / Push；逐跳路由、TTL、流生命周期</text>
<rect x="40" y="510" width="970" height="70" rx="9" fill="#f5f2fa" stroke="#6a4ca3" stroke-width="1.6"/>
<text x="525.0" y="540" fill="#6a4ca3" font-size="22" font-weight="700" text-anchor="middle">业务同步：操作日志、对象与文件；双方须获 storage.provide 且提供 Core 存储</text>
<text x="32" y="282" fill="#526575" font-size="18" font-weight="400" text-anchor="start">A 与 C 可经 B 通信；这不会自动生成 A 与 C 的直接配对关系。</text>
</svg>
