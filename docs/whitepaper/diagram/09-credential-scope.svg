<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 650" role="img" aria-label="09  凭据复制与链路加密的不同边界">
<style>text {font-family: SimHei, "Noto Sans SC", "Microsoft YaHei", sans-serif;}</style>
<rect x="0" y="0" width="1050" height="650" rx="12" fill="#ffffff"/>
<text x="32" y="42" fill="#172a3a" font-size="26" font-weight="700" text-anchor="start">09  凭据复制与链路加密的不同边界</text>
<text x="32" y="73" fill="#526575" font-size="18" font-weight="400" text-anchor="start">加密静态文件、保护相邻信道、限制复制对象和信任中继，是不同的问题</text>
<polyline points="340,205 400,205" fill="none" stroke="#8c6000" stroke-width="2"/>
<polygon points="400,205 389.0,200.0 389.0,210.0" fill="#8c6000"/>
<polyline points="650,205 710,205" fill="none" stroke="#8c6000" stroke-width="2"/>
<polygon points="710,205 699.0,200.0 699.0,210.0" fill="#8c6000"/>
<rect x="35" y="135" width="305" height="145" rx="9" fill="#f5f2fa" stroke="#6a4ca3" stroke-width="1.6"/>
<text x="187.5" y="165" fill="#6a4ca3" font-size="22" font-weight="700" text-anchor="middle">源 CoreNode A</text>
<text x="187.5" y="193" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">完整 Provider 配置</text>
<text x="187.5" y="220" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">含 apiKey / pool / headers</text>
<text x="187.5" y="247" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">本机加密保存</text>
<rect x="400" y="135" width="250" height="145" rx="9" fill="#fbf7ed" stroke="#8c6000" stroke-width="1.6"/>
<text x="525.0" y="165" fill="#8c6000" font-size="22" font-weight="700" text-anchor="middle">中继 B</text>
<text x="525.0" y="193" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">逐跳信道端点</text>
<text x="525.0" y="220" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">可读取转发明文</text>
<text x="525.0" y="247" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">重新加密下一跳</text>
<rect x="710" y="135" width="305" height="145" rx="9" fill="#f5f2fa" stroke="#6a4ca3" stroke-width="1.6"/>
<text x="862.5" y="165" fill="#6a4ca3" font-size="22" font-weight="700" text-anchor="middle">存储副本 C</text>
<text x="862.5" y="193" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">获授权接收配置原文</text>
<text x="862.5" y="220" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">用自身密钥静态保存</text>
<text x="862.5" y="247" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">可使用收到的配置</text>
<text x="525" y="325" fill="#8c6000" font-size="19" font-weight="400" text-anchor="middle">PeerLink：A–B 与 B–C 分别认证加密；当前无对 B 保密的端到端封装</text>
<rect x="35" y="380" width="460" height="130" rx="9" fill="#f1f8f4" stroke="#16704a" stroke-width="1.6"/>
<text x="265.0" y="410" fill="#16704a" font-size="22" font-weight="700" text-anchor="middle">OAuth 会话</text>
<text x="265.0" y="438" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">GitHub / Codex：node-local SecretStore</text>
<text x="265.0" y="465" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">不进入 Space 业务复制；本机静态加密</text>
<rect x="550" y="380" width="465" height="130" rx="9" fill="#fcf2f4" stroke="#ac3550" stroke-width="1.6"/>
<text x="782.5" y="410" fill="#ac3550" font-size="22" font-weight="700" text-anchor="middle">配对 sessionSecret</text>
<text x="782.5" y="438" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">node-local StateStore，不进入业务复制</text>
<text x="782.5" y="465" fill="#172a3a" font-size="18" font-weight="400" text-anchor="middle">当前未启用 Preference 静态加密</text>
<text x="32" y="565" fill="#526575" font-size="18" font-weight="400" text-anchor="start">授权撤销阻止后续访问，不能收回其他设备已经获得的配置、密钥、明文或备份。</text>
<text x="32" y="608" fill="#526575" font-size="18" font-weight="400" text-anchor="start">Space 成员和路由中继必须属于用户接受的信任范围；不要假设中继天然只处理密文。</text>
</svg>
