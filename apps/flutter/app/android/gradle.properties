org.gradle.jvmargs=-Xmx48G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=1024m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.workers.max=64
org.gradle.caching=true
# The Kotlin compile daemon defaults to a small heap, which serializes work
# long before the 64-core runner runs out of memory.
kotlin.daemon.jvmargs=-Xmx8G
# R8 dexing fans out across workers; keep it in step with the runner.
android.r8.maxWorkers=32
android.useAndroidX=true
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
